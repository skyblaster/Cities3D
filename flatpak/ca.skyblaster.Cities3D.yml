# Cities3D Flatpak — build with flatpak-builder from the repository root:
#   ./flatpak/build.sh
# or:
#   flatpak-builder --user --install --force-clean --install-deps-from=flathub \
#     build-flatpak flatpak/ca.skyblaster.Cities3D.yml
#
# Module builds are sandboxed without network by default. vcpkg is declared as a
# git source (downloaded before the sandbox) and the module gets --share=network
# so cmake/vcpkg can still fetch port archives during configure.
#
# Caching: glu and cities3d are separate from cities3d-metadata. Packaging-only
# edits (desktop/icons/metainfo/launcher) rebuild only the tiny metadata module.
app-id: ca.skyblaster.Cities3D
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: Cities3D

finish-args:
  - --share=ipc
  - --share=network
  # wxWidgets/GTK still needs a real X11 DISPLAY. fallback-x11 skips X11 when a
  # Wayland socket exists, which leaves DISPLAY unset and fails with:
  #   Unable to initialize GTK+, is DISPLAY set properly?
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --env=GDK_BACKEND=x11
  # wxConfig uses ~/.Cities3D/; persist it into the Flatpak app data dir.
  - --persist=.Cities3D

# Do not inherit org.freedesktop.Platform.GL. The runtime already exposes GL via
# --device=dri; inheriting it also mounts under /app and breaks launch with:
#   bwrap: Can't mkdir parents for /app/lib/.../GL: Read-only file system

# Drop build-only metadata after all modules finish. Keep libGLU.so for GLEW.
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la
  - /share/pkgconfig

# Speeds rebuilds when flatpak-builder is invoked with --ccache (build.sh default).
build-options:
  ccache: true

modules:
  # Freedesktop SDK has OpenGL but not GLU. vcpkg's glew port requires glu.pc.
  # Keep pkg-config files until the final cleanup so the cities3d module can see them.
  - glu-9.json

  - name: cities3d
    buildsystem: simple
    build-options:
      # Keep symbols so flatpak --devel gdb / coredumpctl can name frames.
      strip: false
      no-debuginfo: true
      # Allow DNS/HTTPS inside the build sandbox (vcpkg bootstrap + port downloads).
      build-args:
        - --share=network
      env:
        # Shared wx + system GTK/GLib — see triplets/ and overlays/flatpak-system-gtk/.
        VCPKG_DEFAULT_TRIPLET: x64-linux-wxshared
        VCPKG_OVERLAY_TRIPLETS: triplets
        VCPKG_OVERLAY_PORTS: overlays/flatpak-system-gtk
        VCPKG_FORCE_SYSTEM_BINARIES: "1"
    build-commands:
      - |
        set -euo pipefail
        # Parallelism for vcpkg (during cmake configure) and ninja. Prefer the
        # host-chosen CITIES3D_BUILD_JOBS from build.sh; otherwise nproc, capped
        # by MemAvailable so RelWithDebInfo bulkbuilds do not thrash (~1.8 GiB each).
        cpus="$(nproc)"
        mem_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)"
        if [ "${mem_kb}" -gt 0 ]; then
          mem_jobs=$((mem_kb / 1800000))
          if [ "${mem_jobs}" -lt 1 ]; then
            mem_jobs=1
          fi
        else
          mem_jobs="${cpus}"
        fi
        JOBS="${CITIES3D_BUILD_JOBS:-}"
        if [ -z "${JOBS}" ]; then
          JOBS="${cpus}"
          if [ "${JOBS}" -gt "${mem_jobs}" ]; then
            JOBS="${mem_jobs}"
          fi
        fi
        echo "cities3d: build jobs=${JOBS} (nproc=${cpus}, mem-cap=${mem_jobs}, MemAvailable_kB=${mem_kb})"
        export CMAKE_BUILD_PARALLEL_LEVEL="${JOBS}"
        export VCPKG_MAX_CONCURRENCY="${JOBS}"
        VCPKG_ROOT="${PWD}/vcpkg"
        TRIPLET=x64-linux-wxshared
        OVERLAY_TRIPLETS="${PWD}/triplets"
        OVERLAY_PORTS="${PWD}/overlays/flatpak-system-gtk"
        if [ ! -f "${OVERLAY_TRIPLETS}/${TRIPLET}.cmake" ]; then
          echo "ERROR: missing overlay triplet ${OVERLAY_TRIPLETS}/${TRIPLET}.cmake" >&2
          ls -la "${OVERLAY_TRIPLETS}" >&2 || true
          exit 1
        fi
        if [ ! -f "${OVERLAY_PORTS}/gtk3/portfile.cmake" ] || [ ! -f "${OVERLAY_PORTS}/cairo/portfile.cmake" ]; then
          echo "ERROR: missing system-GTK overlay ports under ${OVERLAY_PORTS}" >&2
          ls -laR "${OVERLAY_PORTS}" >&2 || true
          exit 1
        fi
        if [ ! -x "${VCPKG_ROOT}/vcpkg" ]; then
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
        fi
        export VCPKG_ROOT
        export VCPKG_DEFAULT_TRIPLET="${TRIPLET}"
        export VCPKG_OVERLAY_TRIPLETS="${OVERLAY_TRIPLETS}"
        export VCPKG_OVERLAY_PORTS="${OVERLAY_PORTS}"
        # Never reuse a host/cached CMake tree that may still be on static x64-linux.
        rm -rf trunk/build/flatpak
        cmake -S trunk -B trunk/build/flatpak -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET="${TRIPLET}" \
          -DVCPKG_OVERLAY_TRIPLETS="${OVERLAY_TRIPLETS}" \
          -DVCPKG_OVERLAY_PORTS="${OVERLAY_PORTS}" \
          -DOpenGL_GL_PREFERENCE=LEGACY
        cmake --build trunk/build/flatpak -j "${JOBS}"
        DIST="trunk/Cities3D/distribute"
        WX_LIB_DIR="trunk/build/flatpak/vcpkg_installed/${TRIPLET}/lib"
        if [ ! -d "${WX_LIB_DIR}" ]; then
          echo "ERROR: vcpkg installed dir missing for ${TRIPLET}: ${WX_LIB_DIR}" >&2
          ls -la trunk/build/flatpak/vcpkg_installed >&2 || true
          exit 1
        fi
        if ! compgen -G "${WX_LIB_DIR}/libwx_*.so*" > /dev/null; then
          echo "ERROR: no shared libwx_*.so under ${WX_LIB_DIR} (static wx would SEGV)" >&2
          ls -la "${WX_LIB_DIR}"/libwx_* >&2 || true
          exit 1
        fi
        # Shared libwx must NEEDED the SDK GTK/GLib — not embed static copies.
        WX_CORE="$(ls -1 "${WX_LIB_DIR}"/libwx_gtk3u_core-*.so.* 2>/dev/null | head -n1 || true)"
        if [ -z "${WX_CORE}" ]; then
          echo "ERROR: missing libwx_gtk3u_core shared library" >&2
          ls -la "${WX_LIB_DIR}"/libwx_* >&2 || true
          exit 1
        fi
        echo "cities3d: ldd $(basename "${WX_CORE}")"
        ldd "${WX_CORE}" || true
        if ! ldd "${WX_CORE}" | grep -q 'libgtk-3\.so'; then
          echo "ERROR: ${WX_CORE} does not link shared libgtk-3 (static GTK embeds GLib and aborts)" >&2
          exit 1
        fi
        if ! ldd "${WX_CORE}" | grep -q 'libglib-2\.0\.so'; then
          echo "ERROR: ${WX_CORE} does not link shared libglib-2.0" >&2
          exit 1
        fi
        if compgen -G "${WX_LIB_DIR}/libglib-2.0.so*" > /dev/null; then
          echo "ERROR: vcpkg still installed libglib under ${WX_LIB_DIR}; refusing dual-GLib" >&2
          ls -la "${WX_LIB_DIR}"/libglib* >&2 || true
          exit 1
        fi
        for lib in DatabaseCore ModelCore RulesCore GLCore UICore Cities3D; do
          path="${DIST}/${lib}"
          if [ "${lib}" != "Cities3D" ]; then
            path="${DIST}/${lib}.so"
          fi
          if [ ! -e "${path}" ]; then
            echo "ERROR: missing build output ${path}" >&2
            exit 1
          fi
          if ! ldd "${path}" | grep -q 'libwx_'; then
            echo "ERROR: ${path} does not link shared libwx (still static?)" >&2
            ldd "${path}" >&2 || true
            exit 1
          fi
        done
        if ! ldd "${DIST}/GLCore.so" | grep -q 'libGLU\.so'; then
          echo "ERROR: GLCore.so does not link libGLU (plugins need gluDisk)" >&2
          ldd "${DIST}/GLCore.so" >&2 || true
          exit 1
        fi
        echo "cities3d: verified shared libwx + system GTK/GLib + libGLU linkage"
      - install -d "${FLATPAK_DEST}/share/cities3d"
      - |
        set -euo pipefail
        DIST="trunk/Cities3D/distribute"
        TRIPLET=x64-linux-wxshared
        WX_LIB_DIR="trunk/build/flatpak/vcpkg_installed/${TRIPLET}/lib"
        # Binary + core shared libraries next to plugins/tex/skins.
        install -m755 "${DIST}/Cities3D" "${FLATPAK_DEST}/share/cities3d/Cities3D"
        for lib in DatabaseCore ModelCore RulesCore GLCore UICore; do
          if [ -f "${DIST}/${lib}.so" ]; then
            install -m755 "${DIST}/${lib}.so" "${FLATPAK_DEST}/share/cities3d/${lib}.so"
          fi
        done
        # One shared libwx for the executable, cores, and plugins.
        shopt -s nullglob
        wx_installed=0
        for so in "${DIST}"/libwx_*.so* "${WX_LIB_DIR}"/libwx_*.so*; do
          install -m755 "${so}" "${FLATPAK_DEST}/share/cities3d/$(basename "${so}")"
          wx_installed=$((wx_installed + 1))
        done
        if [ "${wx_installed}" -eq 0 ]; then
          echo "ERROR: installed zero libwx_*.so* into the Flatpak" >&2
          exit 1
        fi
        echo "cities3d: installed ${wx_installed} libwx shared objects"
        # Mesa GLU from the glu module lives in /app/lib; also place it next to
        # GLCore so $ORIGIN / launcher LD_LIBRARY_PATH always resolve gluDisk.
        glu_installed=0
        for so in /app/lib/libGLU.so* "${FLATPAK_DEST}/lib"/libGLU.so*; do
          if [ -e "${so}" ]; then
            install -m755 "${so}" "${FLATPAK_DEST}/share/cities3d/$(basename "${so}")"
            glu_installed=$((glu_installed + 1))
          fi
        done
        if [ "${glu_installed}" -eq 0 ]; then
          echo "ERROR: libGLU.so* not found to install next to GLCore" >&2
          ls -la /app/lib/libGLU* >&2 || true
          exit 1
        fi
        echo "cities3d: installed ${glu_installed} libGLU shared objects"
        if [ -d "${DIST}/plugins" ]; then
          cp -a "${DIST}/plugins" "${FLATPAK_DEST}/share/cities3d/"
        fi
        # data/ holds maps.db + mapkey.db (FilePath::Data).
        for dir in tex skins maps locale sounds help data; do
          if [ -d "${DIST}/${dir}" ]; then
            cp -a "${DIST}/${dir}" "${FLATPAK_DEST}/share/cities3d/"
          fi
        done
    sources:
      # Pin to the builtin-baseline in trunk/vcpkg.json so port versions match.
      - type: git
        url: https://github.com/microsoft/vcpkg.git
        commit: 0c2a9ace1964b818b15f7ae50ba1c42404918a7b
        dest: vcpkg
      - type: dir
        path: ..
        # Basename match: skip host build trees that can pin the wrong triplet.
        skip:
          - build
          - build-flatpak
          - .flatpak-builder
          - .git

  # Desktop integration only — keep this module tiny so packaging tweaks do not
  # invalidate the cities3d compile cache.
  - name: cities3d-metadata
    buildsystem: simple
    build-commands:
      - install -d "${FLATPAK_DEST}/bin"
      - install -m755 flatpak/cities3d-launcher.sh "${FLATPAK_DEST}/bin/Cities3D"
      - install -Dm644 flatpak/ca.skyblaster.Cities3D.desktop "${FLATPAK_DEST}/share/applications/ca.skyblaster.Cities3D.desktop"
      - install -Dm644 flatpak/ca.skyblaster.Cities3D.metainfo.xml "${FLATPAK_DEST}/share/metainfo/ca.skyblaster.Cities3D.metainfo.xml"
      - |
        set -euo pipefail
        for size in 32 48 64 128 256; do
          install -Dm644 \
            "flatpak/icons/${size}/apps/ca.skyblaster.Cities3D.png" \
            "${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/ca.skyblaster.Cities3D.png"
        done
    sources:
      - type: dir
        path: ../flatpak
        dest: flatpak
